<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer circle decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  
  <!-- Wallet / Card Icon -->
  <rect x="116" y="166" width="280" height="180" rx="24" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.25))"/>
  
  <!-- Card Header Line -->
  <path d="M 116 220 L 396 220" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Dollar / Rupiah Coin / Overtime Clock Indicator -->
  <circle cx="340" cy="256" r="32" fill="url(#accent)"/>
  
  <!-- Clock hands inside badge representing Overtime -->
  <circle cx="340" cy="256" r="26" fill="none" stroke="#ffffff" stroke-width="3"/>
  <polyline points="340 242 340 256 350 262" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Currency symbol "Rp" on card -->
  <text x="150" y="275" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="52" fill="#1e3a8a">Rp</text>
  
  <!-- Star / Sparkle badge -->
  <polygon points="340,116 348,136 368,144 348,152 340,172 332,152 312,144 332,136" fill="#fbbf24"/>
</svg>
