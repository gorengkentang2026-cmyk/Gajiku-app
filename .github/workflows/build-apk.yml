name: Build Android APK (Kotlin)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (Kotlin Native)
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/GajiKu-Release-by-RDA.apk

      - name: Upload APK Artifact (Siap Download ke HP)
        uses: actions/upload-artifact@v4
        with:
          name: GajiKu-Release-by-RDA
          path: android/app/build/outputs/apk/debug/GajiKu-Release-by-RDA.apk
